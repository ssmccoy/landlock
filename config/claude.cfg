# Example Claude configuration; review permissions before use.
env COLORTERM
env HOME
env PATH="$HOME/.local/go/bin:$HOME/bin:$HOME/.local/bin:/usr/bin"
env TERM
env CLAUDE_CODE_TMPDIR=/tmp/claude
env TMPDIR=/tmp/claude
env TMPPREFIX=/tmp/claude/zsh

ro ~/.aws/credentials

dir /tmp/claude

# Would be nice if it didn't need the whole password file, but it does...
ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/manpath.config
ro /sys
ro /etc/alternatives

# Local git configs just so git works as expected and rules are applied
ro ~/.git*
# ro ~/.gitignore
# ro ~/.gitignore-global
ro ~/.quantcast.gitconfig

# Allow access to vim configuration.
rox ~/.vim*
# An unmatched pattern grants no permission.
#rwx /tmp/vim-mcp-server.soc[k]

# MCP processes require broad temporary-directory access in this example.
rwx /tmp

# Basic execution access for userspace tools.
rox /bin
# Broad device access retained for compatibility.
rwx /dev
rox /lib
rox /proc
rox /usr/libexec
ro /usr/share
ro /usr/include

# Because it's written in node...
rox /usr/share/node_modules
rox /usr/share/nodejs

# Local tools and their installation directories.
rox ~/.local/bin
rwx ~/.local/lib/node_modules # Installation directory

# Claude executable installation directory.
rwx ~/.local/share/claude

# Node package cache.
rwx ~/.npm
rw ~/.cache/Cypress

# Claude redirects to null a bunch...
rw /dev/null
# A narrower temporary-directory permission for local customization.
# rw /tmp/claude

rw ~/.claude
rw ~/.claude.json

rwx .

# Permit all networking for this example.
unrestricted-network
